name: Package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-package:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download ffmpeg / ffprobe / fpcalc
        shell: pwsh
        run: ./scripts/download-tools.ps1

      - name: Build portable package
        shell: pwsh
        run: ./scripts/make-package.ps1

      - name: Zip package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            (Get-Content package.json | ConvertFrom-Json).version
          }
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "dupfinder-windows-x64-$version-$sha"
          $src = "release/dupfinder"
          $zip = "release/$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name, Length, FullName
          "PACKAGE_ZIP=$zip" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$name" >> $env:GITHUB_ENV

      # Zip includes ffmpeg (~100MB+). Free plan artifact storage is only 500 MB,
      # so keep push artifacts briefly; release assets on tags are separate.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 7

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_ZIP }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
